# Build → push → deploy vanna-credit-backend to Cloud Run (test.solana.vanna.finance).
#
#   gcloud builds submit . --project=vanna-credit-solana-test --region=us-central1 \
#     --config=cloudbuild.yaml \
#     --service-account=projects/vanna-credit-solana-test/serviceAccounts/vanna-credit-builder@vanna-credit-solana-test.iam.gserviceaccount.com \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so they are build args here.
# The deploy step changes ONLY the image: `gcloud run deploy --image` keeps the service's existing
# runtime env vars (FORK_RPC_URL, NEXT_PUBLIC_* runtime copies, …) and any secret mounts exactly as
# they are. Change runtime values with `gcloud run services update --update-env-vars=…`.

substitutions:
  _REGION: us-central1
  _REPO: vanna-credit
  _IMAGE_NAME: app
  _SERVICE: vanna-credit-solana-test
  _TAG: latest

  # Public, client-inlined.
  _SITE_URL: https://test.solana.vanna.finance
  _SOLANA_RPC_URL: https://rpc-devnet.solana.vanna.finance
  _SOLANA_WS_URL: wss://rpc-devnet.solana.vanna.finance
  _VANNA_PROGRAM_ID: H37YVBG3eGtz89ofd7iDLc2PJgn12778392XeU2QJcGC

options:
  # Required when the build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_SOLANA_RPC_URL=${_SOLANA_RPC_URL}
      - --build-arg=NEXT_PUBLIC_SOLANA_WS_URL=${_SOLANA_WS_URL}
      - --build-arg=NEXT_PUBLIC_VANNA_PROGRAM_ID=${_VANNA_PROGRAM_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
      - .

  # Explicit push (not the top-level `images:` key, which pushes only after every step — the
  # deploy step below would reference a tag that doesn't exist yet).
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --quiet
